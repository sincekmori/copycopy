version: 2
# No `cooldown`: Dependabot's own default applies (the release-age policy is in
# .cargo/config.toml). It delays what Dependabot proposes, not what cargo then
# locks: for a transitive dependency cargo picks the version, and the floor in
# .cargo/config.toml only binds a cargo from 1.100 on. Until Dependabot's
# updater runs one (the `rust:` image in cargo/Dockerfile of
# dependabot/dependabot-core), check the publish dates in a cargo pull
# request's Cargo.lock diff before merging it.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Transitive dependencies too. By default only the crates named in
    # Cargo.toml are updated, and the rest of Cargo.lock stays where it is until
    # a yank or an advisory turns up in it.
    allow:
      - dependency-type: all
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
