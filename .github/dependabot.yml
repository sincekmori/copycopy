version: 2
# Release-age policy: each tool's own default, and one day where a tool
# defines none. Dependabot defines one (3 days when this was written), so
# there is no `cooldown` here; cargo defines none, see .cargo/config.toml.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Transitive dependencies too. By default only the crates named in
    # Cargo.toml are updated, and the rest of Cargo.lock stays where it is until
    # a yank or an advisory turns up in it.
    allow:
      - dependency-type: all
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
