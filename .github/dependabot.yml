version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Transitive dependencies too. By default only the crates named in
    # Cargo.toml are updated, and the rest of Cargo.lock stays where it is until
    # a yank or an advisory turns up in it.
    allow:
      - dependency-type: all
    # Supply-chain mitigation: only propose versions that have been public for 7 days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
